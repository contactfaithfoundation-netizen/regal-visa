    <style>
      /* Ensure pristine white before JavaScript hydration so there is zero black-to-white flash */
      html, body {
        background-color: #ffffff;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        transition: opacity 0.5s ease-out;
      }
      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loader-logo {
        height: 64px;
        width: auto;
        object-fit: contain;
        animation: pulseLogo 1.6s ease-in-out infinite alternate;
      }
      @keyframes pulseLogo {
        from { transform: scale(0.97); opacity: 0.92; }
        to { transform: scale(1.02); opacity: 1; }
      }
      .loader-bar-bg {
        margin-top: 24px;
        width: 72px;
        height: 2.5px;
        border-radius: 9999px;
        background-color: #f1f5f9;
        overflow: hidden;
        position: relative;
      }
      .loader-bar-shimmer {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #1d4ed8, transparent);
        animation: barShimmer 1.1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes barShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
